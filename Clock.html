<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>

    <h1>Digital Clock</h1>
    <h2 id="clock"></h2>

    <script>
        function showTime() {
            var date = new Date();

            var h = date.getHours();
            var m = date.getMinutes();
            var s = date.getSeconds();

            if (h < 10) {
                h = "0" + h;
            }

            if (m < 10) {
                m = "0" + m;
            }

            if (s < 10) {
                s = "0" + s;
            }

            document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
        }

        setInterval(showTime, 1000);
        showTime();
    </script>

</body>
</html>
