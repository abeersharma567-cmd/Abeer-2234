<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#6a11cb,#2575fc);
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        h2{
            margin-bottom:20px;
        }

        #display{
            font-size:45px;
            margin-bottom:20px;
            color:#2575fc;
        }

        button{
            padding:10px 20px;
            margin:5px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            color:white;
        }

        .start{
            background:green;
        }

        .stop{
            background:red;
        }

        .reset{
            background:orange;
            color:black;
        }

        button:hover{
            opacity:0.8;
        }
    </style>

</head>
<body>

<div class="container">

<h2>Stopwatch</h2>

<h1 id="display">00:00:000</h1>

<button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button>
<button class="reset" onclick="reset()">Reset</button>

</div>

<script>

let minutes = 0;
let seconds = 0;
let milliseconds = 0;
let timer = null;

function updateTime(){

    milliseconds += 10;

    if(milliseconds >= 1000){
        milliseconds = 0;
        seconds++;
    }

    if(seconds >= 60){
        seconds = 0;
        minutes++;
    }

    document.getElementById("display").innerHTML =
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0") + ":" +
        String(milliseconds).padStart(3,"0");
}

function start(){
    if(timer == null){
        timer = setInterval(updateTime,10);
    }
}

function stop(){
    clearInterval(timer);
    timer = null;
}

function reset(){
    clearInterval(timer);
    timer = null;

    minutes = 0;
    seconds = 0;
    milliseconds = 0;

    document.getElementById("display").innerHTML = "00:00:000";
}

</script>

</body>
</html>
